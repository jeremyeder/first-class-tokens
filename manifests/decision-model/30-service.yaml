apiVersion: v1
kind: Service
metadata:
  name: decision-model
  namespace: kueue-demo
  labels:
    app.kubernetes.io/name: diffusiongemma-structured-decision
    app.kubernetes.io/component: decision-model
    app.kubernetes.io/part-of: business-priority-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: diffusiongemma-structured-decision
  ports:
    # The structured decision API is the only port published by this Service.
    # vLLM's 8000 port remains loopback-only inside the pod.
    - name: decisions
      port: 8011
      targetPort: decisions
      protocol: TCP
