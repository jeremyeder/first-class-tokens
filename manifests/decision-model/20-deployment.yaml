apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-model
  namespace: kueue-demo
  labels:
    app.kubernetes.io/name: diffusiongemma-structured-decision
    app.kubernetes.io/component: decision-model
    app.kubernetes.io/part-of: business-priority-demo
    app.kubernetes.io/version: vllm-e9757321527ca1ecd514c07c1418dd2c53da3d19-fp8-r3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: diffusiongemma-structured-decision
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diffusiongemma-structured-decision
        app.kubernetes.io/component: decision-model
        app.kubernetes.io/part-of: business-priority-demo
        app.kubernetes.io/version: vllm-e9757321527ca1ecd514c07c1418dd2c53da3d19-fp8-r3
    spec:
      serviceAccountName: decision-model
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: decision-model
          image: image-registry.openshift-image-registry.svc:5000/kueue-demo/diffusiongemma-structured-decision@sha256:b4b71e396e4c518a52cb73e2955a2423d163119e4509316dbd830d2b766c4a85
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: decision-model-config-v3
          env:
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HOME
              value: /models/cache
            - name: XDG_CACHE_HOME
              value: /models/cache/.cache
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /models/cache/torchinductor
          ports:
            - name: vllm-internal
              containerPort: 8000
              protocol: TCP
            - name: decisions
              containerPort: 8011
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: decisions
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: decisions
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: decisions
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: model-cache
              mountPath: /models/cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: decision-model-cache
