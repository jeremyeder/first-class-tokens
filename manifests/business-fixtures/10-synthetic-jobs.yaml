# These Jobs are the suspended queue projections for fixture items 004-020.
# Items 001-003 deliberately use the three baseline Jobs in 00-demo-lane.yaml
# so the capacity-holder safety scenario remains unchanged.
apiVersion: batch/v1
kind: Job
metadata:
  name: customer-onboarding-004
  namespace: kueue-demo
  labels:
    app.kubernetes.io/part-of: business-priority-demo
    kueue.x-k8s.io/queue-name: business-priority
    kueue.x-k8s.io/priority-class: fare-economy
    demo.kueue.io/fixture: synthetic-event-feed
    demo.kueue.io/business-source: crm
spec:
  suspend: true
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: work
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["sleep", "300"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
